name: Descargar Imagen de Metabase

on:
  workflow_dispatch: # Esto te permite ejecutar el script manualmente con un botón

jobs:
  descargar-y-comprimir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar imagen de Metabase
        run: docker pull metabase/metabase:latest

      - name: Guardar y comprimir la imagen
        # docker save extrae la imagen y gzip la comprime para que pese mucho menos al descargarla
        run: docker save metabase/metabase:latest | gzip > metabase-latest.tar.gz

      - name: Subir como artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: metabase-docker-image
          path: metabase-latest.tar.gz
          retention-days: 1 # Se borrará de GitHub en 1 día para no ocupar espacio innecesario
