name: Descargar Imágenes RERO ILS

on:
  workflow_dispatch: # Ejecución manual

jobs:
  download-rero-images:
    runs-on: ubuntu-latest
    steps:
      - name: Definir lista de imágenes oficiales de RERO
        run: |
          cat > images.txt << 'EOF'
          ghcr.io/rero/rero-ils-api:latest
          ghcr.io/rero/rero-ils-ui:latest
          ghcr.io/rero/rero-ils-worker:latest
          postgres:13
          elasticsearch:7.17.9
          redis:alpine
          nginx:alpine
          EOF
          cat images.txt

      - name: Descargar todas las imágenes
        run: |
          mkdir -p rero-images
          while IFS= read -r image; do
            echo "Descargando: $image"
            docker pull "$image" || echo "Error descargando $image, continuando..."
          done < images.txt

      - name: Guardar imágenes en archivos .tar
        run: |
          cd rero-images
          while IFS= read -r image; do
            # Crear nombre de archivo seguro
            safe_name=$(echo "$image" | sed 's/[\/:]/_/g')
            echo "Guardando $image como $safe_name.tar"
            docker save "$image" -o "$safe_name.tar" || echo "Error guardando $image"
          done < ../images.txt

      - name: Comprimir todas las imágenes
        run: |
          tar -czvf rero-ils-images-complete.tar.gz rero-images/
          ls -lh rero-ils-images-complete.tar.gz

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: rero-ils-docker-images
          path: rero-ils-images-complete.tar.gz
          retention-days: 7
