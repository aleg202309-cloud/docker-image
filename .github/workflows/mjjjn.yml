name: Build and Export Invenio ILS Images

on:
  workflow_dispatch:

jobs:
  build-and-export:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Invenio ILS repository
      uses: actions/checkout@v4
      with:
        repository: inveniosoftware/invenio-app-ils
        ref: master

    # 🔍 PASO DE DEPURACIÓN: Te mostrará exactamente qué hay en el repositorio
    - name: Debug directory structure
      run: |
        echo "📂 Directorio actual: $(pwd)"
        echo "📋 Contenido del repositorio:"
        ls -la
        echo "🔍 Buscando Dockerfiles:"
        find . -name "Dockerfile"
        echo "🔍 Buscando docker-compose:"
        find . -name "docker-compose*.yml"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Pull base images
      run: |
        echo "⬇️ Descargando imágenes base de servicios..."
        docker pull redis:6
        docker pull postgres:14
        docker pull rabbitmq:3-management
        docker pull opensearchproject/opensearch:3.2.0
        docker pull opensearchproject/opensearch-dashboards:3.2.0
        docker pull mher/flower:0.9.7
        docker pull haproxy:2.2
        docker pull node:12
        docker pull nginx:1.18
        
        echo "⬇️ Descargando imagen base del backend..."
        docker pull registry.cern.ch/inveniosoftware/almalinux:1 || {
          echo "⚠️ Imagen del CERN no disponible, usando almalinux:1 como fallback"
          docker pull almalinux:1
          docker tag almalinux:1 registry.cern.ch/inveniosoftware/almalinux:1
        }
        
    - name: Build custom images
      run: |
        echo "🛠️ Construyendo imagen del backend desde la raíz..."
        # El repositorio invenio-app-ils tiene el Dockerfile en la raíz, no en subcarpetas
        docker build -t invenio_app_ils-backend .
        
        # Como este repo es solo el paquete Python, usamos la misma imagen para el worker
        docker tag invenio_app_ils-backend invenio_app_ils-worker
        
    - name: Export all images to single file
      run: |
        echo "📦 Exportando todas las imágenes a un solo archivo..."
        # Nota: Hemos eliminado frontend y lb de aquí porque no se construyen en este repo
        docker save \
          redis:6 \
          postgres:14 \
          rabbitmq:3-management \
          opensearchproject/opensearch:3.2.0 \
          opensearchproject/opensearch-dashboards:3.2.0 \
          mher/flower:0.9.7 \
          haproxy:2.2 \
          node:12 \
          nginx:1.18 \
          registry.cern.ch/inveniosoftware/almalinux:1 \
          invenio_app_ils-backend \
          invenio_app_ils-worker \
          -o invenio-ils-images.tar
          
        echo "🗜️ Comprimiendo archivo..."
        gzip invenio-ils-images.tar
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: invenio-ils-images
        path: invenio-ils-images.tar.gz
        retention-days: 30
