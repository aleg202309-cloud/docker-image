name: Download Invenio Base Images

on:
  workflow_dispatch:

jobs:
  download-and-export:
    runs-on: ubuntu-latest
    steps:
    - name: Pull all required base images
      run: |
        echo "⬇️ Descargando imágenes base (esto puede tardar unos minutos)..."
        docker pull redis:6
        docker pull postgres:14
        docker pull rabbitmq:3-management
        docker pull opensearchproject/opensearch:3.2.0
        docker pull opensearchproject/opensearch-dashboards:3.2.0
        docker pull mher/flower:0.9.7
        docker pull haproxy:2.2
        docker pull node:12
        docker pull nginx:1.18
        docker pull registry.cern.ch/inveniosoftware/almalinux:1 || {
          echo "⚠️ Fallback a almalinux:1"
          docker pull almalinux:1
          docker tag almalinux:1 registry.cern.ch/inveniosoftware/almalinux:1
        }
        
    - name: Export images to single TAR file
      run: |
        echo "📦 Empaquetando imágenes..."
        docker save \
          redis:6 \
          postgres:14 \
          rabbitmq:3-management \
          opensearchproject/opensearch:3.2.0 \
          opensearchproject/opensearch-dashboards:3.2.0 \
          mher/flower:0.9.7 \
          haproxy:2.2 \
          node:12 \
          nginx:1.18 \
          registry.cern.ch/inveniosoftware/almalinux:1 \
          -o invenio-base-images.tar
          
        echo "🗜️ Comprimiendo..."
        gzip invenio-base-images.tar
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: invenio-base-images
        path: invenio-base-images.tar.gz
        retention-days: 30
