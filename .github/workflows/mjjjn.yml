name: Export All Images Single File

on:
  workflow_dispatch:

jobs:
  export-single-file:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Pull and build all images
      run: |
        # Servicios
        docker pull redis:6
        docker pull postgres:14
        docker pull rabbitmq:3-management
        docker pull opensearchproject/opensearch:3.2.0
        docker pull opensearchproject/opensearch-dashboards:3.2.0
        docker pull mher/flower:0.9.7
        
        # Bases
        docker pull haproxy:2.2
        docker pull node:12
        docker pull nginx:1.18
        docker pull registry.cern.ch/inveniosoftware/almalinux:1
        
        # Personalizadas
        docker build -t invenio_app_ils-backend -f docker/backend/Dockerfile .
        docker build -t invenio_app_ils-frontend -f docker/frontend/Dockerfile .
        docker build -t invenio_app_ils-lb -f docker/lb/Dockerfile .
        docker build -t invenio_app_ils-worker -f docker/backend/Dockerfile .
        
    - name: Export all images to single file
      run: |
        docker save \
          redis:6 \
          postgres:14 \
          rabbitmq:3-management \
          opensearchproject/opensearch:3.2.0 \
          opensearchproject/opensearch-dashboards:3.2.0 \
          mher/flower:0.9.7 \
          haproxy:2.2 \
          node:12 \
          nginx:1.18 \
          registry.cern.ch/inveniosoftware/almalinux:1 \
          invenio_app_ils-backend \
          invenio_app_ils-frontend \
          invenio_app_ils-lb \
          invenio_app_ils-worker \
          -o invenio-ils-all-images.tar
          
        gzip invenio-ils-all-images.tar
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: invenio-ils-all-images
        path: invenio-ils-all-images.tar.gz
        retention-days: 30
