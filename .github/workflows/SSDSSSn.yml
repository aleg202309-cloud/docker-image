name: Build and Package Invenio ILS Offline Stack

on:
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Invenio ILS Repository
        uses: actions/checkout@v4
        with:
          repository: 'inveniosoftware/invenio-app-ils'
          ref: 'v7.2.1'

      # 1. Configurar Node 16 directamente en el servidor virtual de GitHub
      - name: Set up Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: 16

      # 2. Compilar la interfaz gráfica React fuera de Docker (Rápido y controlado)
      - name: Build Frontend Assets Locally
        run: |
          cd src/frontend
          npm config set strict-ssl false
          npm install --legacy-peer-deps
          CI=false GENERATE_SOURCEMAP=false npm run build

      # 3. Modificar el Dockerfile para que no intente compilar nada, solo use lo que ya procesamos
      - name: Simplify Frontend Dockerfile
        run: |
          # Reemplazar todo el contenido del Dockerfile del frontend para que sea un Nginx simple
          cat << 'EOF' > docker/frontend/Dockerfile
          FROM nginx:1.18
          
          ENV REACT_ASSETS=/usr/share/nginx/html/react-assets
          RUN mkdir -p ${REACT_ASSETS}
          
          # Copiar la interfaz que compilamos en el paso anterior directamente a Nginx
          COPY src/frontend/build ${REACT_ASSETS}
          
          COPY docker/frontend/nginx.conf /etc/nginx/nginx.conf
          COPY docker/frontend/conf.d/* /etc/nginx/conf.d/
          COPY docker/frontend/test.key /etc/ssl/private/test.key
          COPY docker/frontend/test.crt /etc/ssl/certs/test.crt
          
          CMD ["nginx", "-g", "daemon off;"]
          EOF

      # 4. Levantar Buildx y empaquetar de forma nativa
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local Invenio images
        run: |
          export CYPRESS_INSTALL_BINARY=0
          docker compose -f docker-compose.full.yml build

      - name: Pull external infrastructure images
        run: |
          docker compose -f docker-compose.full.yml pull

      - name: Export and Compress all images into tar.gz
        run: |
          IMAGES=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -v "<none>")
          echo "Empaquetando ecosistema completo para uso offline..."
          docker save $IMAGES | gzip > invenio_ils_full_stack.tar.gz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: invenio-ils-docker-bundle
          path: invenio_ils_full_stack.tar.gz
          retention-days: 3
          
