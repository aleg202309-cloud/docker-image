name: Build and Package Invenio ILS Offline Stack

on:
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Invenio ILS Repository
        uses: actions/checkout@v4
        with:
          repository: 'inveniosoftware/invenio-app-ils'
          ref: 'v7.2.1'

      # Parche mínimo y seguro: Forzar la imagen base de Node 16 para evitar la obsolescencia
      - name: Upgrade Node Base Image
        run: |
          sed -i 's|node:12|node:16|g' docker/frontend/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Construcción limpia pasando variables globales que Docker Compose inyectará directamente
      - name: Build local Invenio images
        env:
          CYPRESS_INSTALL_BINARY: '0'
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: |
          # Obligamos a NPM a ignorar certificados caídos y usar dependencias legadas globalmente en el host de build
          export NPM_CONFIG_STRICT_SSL=false
          export NPM_CONFIG_LEGACY_PEER_DEPS=true
          docker compose -f docker-compose.full.yml build --build-arg CYPRESS_INSTALL_BINARY=0

      - name: Pull external infrastructure images
        run: |
          docker compose -f docker-compose.full.yml pull

      - name: Export and Compress all images into tar.gz
        run: |
          IMAGES=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -v "<none>")
          echo "Empaquetando ecosistema completo para uso offline..."
          docker save $IMAGES | gzip > invenio_ils_full_stack.tar.gz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: invenio-ils-docker-bundle
          path: invenio_ils_full_stack.tar.gz
          retention-days: 3
          
