name: Build and Package Invenio ILS Offline Stack

on:
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Invenio ILS Repository
        uses: actions/checkout@v4
        with:
          repository: 'inveniosoftware/invenio-app-ils'
          ref: 'v7.2.1'

      # 1. Configurar Node 16 directamente en el runner
      - name: Set up Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: 16

      # 2. Localizar y compilar el Frontend dinámicamente donde sea que esté
      - name: Build Frontend Assets Locally
        run: |
          FRONTEND_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \;)
          echo "Carpeta del frontend encontrada en: $FRONTEND_DIR"
          cd "$FRONTEND_DIR"
          npm config set strict-ssl false
          npm install --legacy-peer-deps
          CI=false GENERATE_SOURCEMAP=false npm run build || npm run compile || echo "Compilación local omitida"

      # 3. Preparar el Dockerfile para producción offline
      - name: Patch Dockerfiles for Compatibility
        run: |
          # Actualizar la imagen base a Node 16 en caso de que Docker decida compilar internamente
          sed -i 's|node:12|node:16|g' docker/frontend/Dockerfile
          # Forzar a NPM interno a usar dependencias legadas si se ejecuta el build tradicional
          sed -i 's|npm install|npm config set strict-ssl false \&\& npm install --legacy-peer-deps --silent|g' docker/frontend/Dockerfile

      # 4. Construir y empaquetar el Stack con Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local Invenio images
        run: |
          export CYPRESS_INSTALL_BINARY=0
          docker compose -f docker-compose.full.yml build

      - name: Pull external infrastructure images
        run: |
          docker compose -f docker-compose.full.yml pull

      - name: Export and Compress all images into tar.gz
        run: |
          IMAGES=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -v "<none>")
          echo "Empaquetando todo el stack institucional offline..."
          docker save $IMAGES | gzip > invenio_ils_full_stack.tar.gz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: invenio-ils-docker-bundle
          path: invenio_ils_full_stack.tar.gz
          retention-days: 3
          
