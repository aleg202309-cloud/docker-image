name: Goobi Workflow Deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy-goobi:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1️⃣ Clonar repositorio
        uses: actions/checkout@v4

      - name: 2️⃣ VERIFICAR que el archivo existe (DEBUG)
        run: |
          echo "📂 Listando archivos en la raíz del repositorio..."
          ls -la
          
          if [ ! -f "docker-compose.yml" ]; then
            echo "❌ ERROR CRÍTICO: No encuentro el archivo 'docker-compose.yml' en la raíz."
            echo "➡️ SOLUCIÓN: Asegúrate de haber hecho 'git add docker-compose.yml', 'git commit' y 'git push'."
            exit 1
          else
            echo "✅ Archivo docker-compose.yml encontrado."
          fi

      - name: 3️⃣ Preparar carpetas de Goobi
        run: |
          mkdir -p ./goobi/config ./goobi/plugins ./goobi/metadata ./goobi/lib ./logs/tomcat/workflow ./db/mysql
          chmod -R 777 ./goobi ./logs ./db

      - name: 4️⃣ Descargar imágenes (Sin compilar)
        run: docker compose pull --quiet

      - name: 5️⃣ Levantar contenedores
        run: docker compose up -d

      - name: 6️⃣ Verificar estado
        if: always()
        run: docker compose ps
