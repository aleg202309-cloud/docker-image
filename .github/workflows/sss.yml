name: Cache InvenioILS Images to GHCR

on:
  workflow_dispatch: 

jobs:
  pull-and-push-images:
    name: Descargar y guardar imágenes
    runs-on: ubuntu-latest
    permissions:
      packages: write 
      contents: read

    steps:
      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} 

      - name: Descargar imágenes de infraestructura pesada
        run: |
          echo "Descargando servicios base..."
          docker pull postgres:14
          docker pull opensearchproject/opensearch:2.11.0
          docker pull redis:7
          docker pull rabbitmq:3-management

      - name: Etiquetar imágenes para tu registro personal
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          echo "Etiquetando para ghcr.io/$OWNER..."
          docker tag postgres:14 ghcr.io/$OWNER/invenio-postgres:14
          docker tag opensearchproject/opensearch:2.11.0 ghcr.io/$OWNER/invenio-opensearch:2.11.0
          docker tag redis:7 ghcr.io/$OWNER/invenio-redis:7
          docker tag rabbitmq:3-management ghcr.io/$OWNER/invenio-rabbitmq:3-management

      - name: Subir imágenes a GitHub Container Registry
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          echo "Subiendo a tu cuenta de GitHub..."
          docker push ghcr.io/$OWNER/invenio-postgres:14
          docker push ghcr.io/$OWNER/invenio-opensearch:2.11.0
          docker push ghcr.io/$OWNER/invenio-redis:7
          docker push ghcr.io/$OWNER/invenio-rabbitmq:3-management
