name: Descargar Modelos Bark y Tortoise

on:
  workflow_dispatch:

jobs:
  descargar_pesados:
    runs-on: ubuntu-latest
    steps:
      - name: Liberar espacio en el servidor
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Instalar libreria base de Hugging Face
        run: pip install huggingface_hub

      - name: Descargar modelos con Python (Método infalible)
        run: |
          # Creamos la carpeta de caché
          mkdir -p ./hf_cache
          export HF_HOME=$(pwd)/hf_cache
          
          # Ejecutamos un pequeño script de Python directamente aquí
          python -c "
          from huggingface_hub import snapshot_download
          
          print('Descargando Bark...')
          snapshot_download(repo_id='suno/bark')
          
          print('Descargando Tortoise...')
          snapshot_download(repo_id='jbetker/tortoise-tts-v2')
          print('¡Descargas completadas con éxito!')
          "

      - name: Comprimir los modelos
        run: |
          tar -czf modelos-tts-cache.tar.gz ./hf_cache

      - name: Subir como artefacto para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Modelos-Voz-Pesados
          path: modelos-tts-cache.tar.gz
          retention-days: 3
