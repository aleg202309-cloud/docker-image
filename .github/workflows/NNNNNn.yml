name: Build Invenio Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-package:
    runs-on: ubuntu-22.04

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurar Python 3.9
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 3. Configurar Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 4. Instalar Pipenv y la librería principal de Invenio
      - name: Install Python and Invenio Core
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
          pipenv install invenio-app-ils==4.0.0 "wtforms>=3.0.0" sentry-sdk --dev

      # 5. Compilar los Assets Visuales (Usando el ejecutable directo)
      - name: Build Web Assets
        env:
          INVENIO_INSTANCE_PATH: ${{ github.workspace }}/instance
        run: |
          # Usamos el ejecutable directo que Pipenv garantiza en su entorno
          pipenv run invenio collect -v
          pipenv run invenio assets build

      # 6. Empaquetar el proyecto en un archivo ZIP listo para descargar
      - name: Create Production Artifact
        run: |
          sudo apt-get install -y zip
          zip -r invenio-build.zip . -x "*.git*" "node_modules/*" "__pycache__/*"

      # 7. Guardar el paquete en GitHub Actions por 7 días
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: invenio-ready-package
          path: invenio-build.zip
          retention-days: 7
          
