name: Build Invenio Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-package:
    runs-on: ubuntu-22.04

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurar Python 3.9
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 3. Configurar Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 4. Instalar paquetes usando la estrategia de bypass definitivo
      - name: Force Install Invenio Core
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
          pipenv --python $(which python)
          
          # Paso A: Instalamos Invenio ignorando sus dependencias conflictivas
          pipenv run pip install --no-deps invenio-app-ils==4.0.0
          
          # Paso B: Forzamos la versión moderna de WTForms y Sentry que pide el sistema
          pipenv run pip install "wtforms>=3.0.0" sentry-sdk
          
          # Paso C: Le decimos a pip que instale todo lo demás que falte de forma normal
          # pero permitiéndole ignorar los conflictos estrictos con '--legacy-resolver'
          pipenv run pip install invenio-app-ils==4.0.0 --use-deprecated=legacy-resolver

      # 5. Compilar los Assets Visuales
      - name: Build Web Assets
        env:
          INVENIO_INSTANCE_PATH: ${{ github.workspace }}/instance
          NODE_ENV: production
        run: |
          pipenv run invenio collect -v
          pipenv run invenio assets build

      # 6. Empaquetar el proyecto listo para tu máquina local
      - name: Create Production Artifact
        run: |
          sudo apt-get install -y zip
          zip -r invenio-build.zip . -x "*.git*" "node_modules/*" "__pycache__/*"

      # 7. Subir el ZIP a GitHub
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: invenio-ready-package
          path: invenio-build.zip
          retention-days: 7
          
