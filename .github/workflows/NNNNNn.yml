name: Build Invenio Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-package:
    runs-on: ubuntu-22.04

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurar Python 3.9 (Obligatorio para Invenio v4)
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 3. Configurar Node.js (Requerido para la interfaz visual)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 4. Instalar Pipenv y forzar el uso de Python 3.9 sin bloqueos estrictos
      - name: Install Python and Invenio Core
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
          
          # Forzamos a pipenv a crear la burbuja usando la ruta exacta de Python 3.9
          pipenv --python $(which python)
          
          # Usamos 'pip install' DENTRO de pipenv para saltarnos el validador rígido
          # Esto evita que 'pipenv lock' destruya el proceso por choques de sub-dependencias
          pipenv run pip install invenio-app-ils==4.0.0 "wtforms>=3.0.0" sentry-sdk

      # 5. Compilar los Assets Visuales
      - name: Build Web Assets
        env:
          INVENIO_INSTANCE_PATH: ${{ github.workspace }}/instance
        run: |
          pipenv run invenio collect -v
          pipenv run invenio assets build

      # 6. Empaquetar el proyecto en un archivo ZIP listo para descargar
      - name: Create Production Artifact
        run: |
          sudo apt-get install -y zip
          zip -r invenio-build.zip . -x "*.git*" "node_modules/*" "__pycache__/*"

      # 7. Guardar el paquete en GitHub Actions por 7 días
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: invenio-ready-package
          path: invenio-build.zip
          retention-days: 7
          
