name: Build Invenio Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-package:
    runs-on: ubuntu-22.04

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurar Python 3.9
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 3. Configurar Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 4. Instalar Pipenv y dependencias de Python
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
          pipenv lock
          pipenv install --deploy --dev

      # 5. Inyectar parches de compatibilidad críticos
      - name: Inject critical patches
        run: |
          pipenv run pip install "wtforms>=3.0.0" sentry-sdk

      # 6. Compilar los Assets Visuales (Corregido: Usando python -m invenio)
      - name: Build Web Assets
        env:
          INVENIO_INSTANCE_PATH: ${{ github.workspace }}/instance
        run: |
          pipenv run python -m invenio collect -v
          pipenv run python -m invenio assets build

      # 7. Empaquetar el proyecto en un archivo ZIP listo para descargar
      - name: Create Production Artifact
        run: |
          sudo apt-get install -y zip
          zip -r invenio-build.zip . -x "*.git*" "node_modules/*" "__pycache__/*"

      # 8. Guardar el paquete en GitHub Actions por 7 días
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: invenio-ready-package
          path: invenio-build.zip
          retention-days: 7
          
