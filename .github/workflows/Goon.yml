name: Despliegue Oficial Goobi Workflow

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy-official-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Forzar descarga de la imagen oficial de Goobi Workflow
        run: docker pull docker.io/intranda/goobi-workflow:latest

      - name: Forzar descarga de la imagen oficial de MariaDB
        run: docker pull docker.io/library/mariadb:latest

      - name: Crear estructura de directorios de volúmenes
        run: |
          mkdir -p ./goobi/config \
                   ./goobi/plugins \
                   ./goobi/metadata \
                   ./goobi/lib \
                   ./logs/tomcat/workflow \
                   ./db/mysql

      - name: Crear archivo docker-compose.yml dinámicamente
        run: |
          cat << 'EOF' > docker-compose.yml
          services:
            workflow:
              image: docker.io/intranda/goobi-workflow:latest
              depends_on:
                - workflow-db
              restart: unless-stopped
              ports:
                - "8080:8080"
              environment:
                DB_HOST: workflow-db
                DB_NAME: goobi
                DB_USER: goobi
                DB_PORT: 3306
                DB_PASSWORD: CHANGEME
                PW_GOOBITESTUSER: CHANGEME
                WORKFLOW_BASE_PATH: /workflow
                GOOBI_ApplicationHeaderTitle: "Goobi workflow"
              volumes:
                - type: bind
                  source: ./goobi/config
                  target: /opt/digiverso/goobi/config
                - type: bind
                  source: ./goobi/plugins
                  target: /opt/digiverso/goobi/plugins
                - type: bind
                  source: ./goobi/metadata
                  target: /opt/digiverso/goobi/metadata
                - type: bind
                  source: ./goobi/lib
                  target: /opt/digiverso/goobi/lib
                - type: bind
                  source: ./logs/tomcat/workflow
                  target: /usr/local/tomcat/logs

            workflow-db:
              image: docker.io/library/mariadb:latest
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
                interval: 60s
                timeout: 10s
                retries: 3
                start_period: 10s
              environment:
                MYSQL_ROOT_PASSWORD: CHANGEME
                MYSQL_DATABASE: goobi
                MYSQL_USER: goobi
                MYSQL_PASSWORD: CHANGEME
                TZ: "Europe/Berlin"
              volumes:
                - type: bind
                  source: ./db/mysql
                  target: /var/lib/mysql
          EOF

      - name: Probar el despliegue de la infraestructura (Test)
        run: docker compose -f ./docker-compose.yml up -d

      - name: Verificar el estado de los servicios
        run: docker compose ps

      - name: Detener contenedores de prueba
        # Es buena práctica detenerlos antes de exportar
        run: docker compose -f ./docker-compose.yml down

      - name: Comprimir imágenes de Docker (tar.gz)
        # Exporta ambas imágenes y las comprime al vuelo para ahorrar espacio y tiempo
        run: |
          docker save docker.io/intranda/goobi-workflow:latest docker.io/library/mariadb:latest | gzip > goobi-stack.tar.gz

      - name: Subir artefacto para descarga
        uses: actions/upload-artifact@v4
        with:
          name: goobi-docker-images
          path: goobi-stack.tar.gz
          retention-days: 5 # El archivo se borrará de GitHub en 5 días para no consumir tu almacenamiento
          
