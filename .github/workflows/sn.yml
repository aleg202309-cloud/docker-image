name: Build and Package Invenio ILS Offline Stack

on:
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Invenio ILS Repository
        uses: actions/checkout@v4
        with:
          repository: 'inveniosoftware/invenio-app-ils'
          ref: 'v7.2.1'

      - name: Patch legacy Node.js and React configuration
        run: |
          echo "Aplicando parches de producción basados en Rollup..."
          
          # A: Cambiar la imagen base del Frontend a Node 16 para compatibilidad
          sed -i 's%FROM node:12%FROM node:16%g' docker/frontend/Dockerfile
          
          # B: Desactivar SSL, omitir Cypress y habilitar soporte para peer dependencies legadas
          sed -i 's%RUN npm install%RUN CYPRESS_INSTALL_BINARY=0 npm config set strict-ssl false \&\& CYPRESS_INSTALL_BINARY=0 npm install --legacy-peer-deps --silent%g' docker/frontend/Dockerfile
          
          # C: Desactivar el modo estricto de CI de GitHub Actions e ignorar source-maps pesados para ahorrar RAM
          sed -i 's%npm run build%CI=false GENERATE_SOURCEMAP=false npm run build%g' docker/frontend/Dockerfile
          
          # D: REPARACIÓN DE RUTA: Modificar la línea de copia final del Dockerfile.
          # Cambiamos /code/build por /code/dist, que es donde Rollup realmente genera los activos.
          sed -i 's%/code/build%/code/dist%g' docker/frontend/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local Invenio images
        run: |
          docker compose -f docker-compose.full.yml build

      - name: Pull external infrastructure images
        run: |
          docker compose -f docker-compose.full.yml pull

      - name: Export and Compress all images into tar.gz
        run: |
          IMAGES=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -v "<none>")
          echo "Empaquetando ecosistema completo para uso offline..."
          docker save $IMAGES | gzip > invenio_ils_full_stack.tar.gz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: invenio-ils-docker-bundle
          path: invenio_ils_full_stack.tar.gz
          retention-days: 3
          
