name: Build and Package Invenio ILS Offline Stack

on:
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código fuente oficial (Usando el Tag Estable)
      - name: Checkout Invenio ILS Repository
        uses: actions/checkout@v4
        with:
          repository: 'inveniosoftware/invenio-app-ils'
          ref: 'v7.2.1' # <-- Cambiado de master a la última versión estable

      # 2. [NUEVO PASO] Parchear la obsolescencia de Node 12
      - name: Patch legacy Node.js configuration
        run: |
          echo "Actualizando el Dockerfile del Frontend..."
          # Actualizar la imagen base a Node 14
          sed -i 's/FROM node:12/FROM node:14/g' docker/frontend/Dockerfile
          # Desactivar la validación SSL estricta antigua y relajar los conflictos de paquetes
          sed -i 's/RUN npm install/RUN npm config set strict-ssl false \&\& npm install --legacy-peer-deps/g' docker/frontend/Dockerfile

      # 3. Configurar el motor de construcción de Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Compilar las imágenes propias de Invenio
      - name: Build local Invenio images
        run: |
          docker compose -f docker-compose.full.yml build

      # 5. Descargar la infraestructura externa
      - name: Pull external infrastructure images
        run: |
          docker compose -f docker-compose.full.yml pull

      # 6. Exportar el ecosistema completo y comprimirlo
      - name: Export and Compress all images into tar.gz
        run: |
          IMAGES=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -v "<none>")
          echo "Empaquetando las siguientes imágenes:"
          echo "$IMAGES"
          docker save $IMAGES | gzip > invenio_ils_full_stack.tar.gz

      # 7. Subir el paquete resultante para su descarga
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: invenio-ils-docker-bundle
          path: invenio_ils_full_stack.tar.gz
          retention-days: 3
          
