name: Build and Package Invenio ILS Offline Stack

on:
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Invenio ILS Repository
        uses: actions/checkout@v4
        with:
          repository: 'inveniosoftware/invenio-app-ils'
          ref: 'v7.2.1'

      - name: Patch legacy Node.js and React configuration
        run: |
          echo "Aplicando parches de diagnóstico y compilación..."
          
          # A: Saltar a Node 16
          sed -i 's/FROM node:12/FROM node:16/g' docker/frontend/Dockerfile
          
          # B: Desactivar SSL, evitar Cypress y usar dependencias legadas
          sed -i 's/RUN npm install/RUN CYPRESS_INSTALL_BINARY=0 npm config set strict-ssl false \&\& CYPRESS_INSTALL_BINARY=0 npm install --legacy-peer-deps/g' docker/frontend/Dockerfile
          
          # C: Comando de compilación inteligente con diagnóstico de ruta
          # Si npm run build falla, listaremos recursivamente el contenido de /code
          sed -i 's/npm run build/CI=false GENERATE_SOURCEMAP=false npm run build || (echo "DIAGNÓSTICO: Buscando archivos generados..." \&\& ls -R /code)/g' docker/frontend/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local Invenio images
        run: |
          docker compose -f docker-compose.full.yml build

      - name: Pull external infrastructure images
        run: |
          docker compose -f docker-compose.full.yml pull

      - name: Export and Compress all images into tar.gz
        run: |
          IMAGES=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -v "<none>")
          docker save $IMAGES | gzip > invenio_ils_full_stack.tar.gz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: invenio-ils-docker-bundle
          path: invenio_ils_full_stack.tar.gz
          retention-days: 3
          
