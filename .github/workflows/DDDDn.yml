name: Descargar y Empaquetar OCR-D Browser
on: 
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  descargar-y-exportar:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar imagen oficial desde Docker Hub
        # Usamos el nombre correcto del repositorio del autor
        run: docker pull hnesk/ocrd_browser:latest

      - name: 2. Empaquetar y comprimir para el Ryzen
        run: |
          docker save hnesk/ocrd_browser:latest | gzip > ocrd_browser_latest.tar.gz

      - name: 3. Subir como archivo descargable (Artefacto)
        uses: actions/upload-artifact@v4
        with:
          name: ocrd-browser-tarball
          path: ocrd_browser_latest.tar.gz
          retention-days: 3
