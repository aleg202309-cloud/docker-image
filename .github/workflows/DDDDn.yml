name: Cwonstruir y Empaquetar OCR-D Browser
on: 
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-export:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Crear las instrucciones de la imagen (Dockerfile)
        run: |
          cat << 'EOF' > Dockerfile
          FROM ubuntu:22.04
          ENV DEBIAN_FRONTEND=noninteractive
          # Instalamos las librerías gráficas de Linux necesarias
          RUN apt-get update && apt-get install -y \
              python3-pip python3-gi python3-gi-cairo \
              gir1.2-gtk-3.0 gir1.2-vte-2.91 \
              && rm -rf /var/lib/apt/lists/*
          # Instalamos OCR-D Browser
          RUN pip3 install --no-cache-dir ocrd-browser
          CMD ["ocrd-browser"]
          EOF

      - name: 2. Ensamblar la imagen usando los servidores de GitHub
        run: docker build -t ocrd-browser:local .

      - name: 3. Empaquetar y comprimir para el Ryzen
        run: |
          docker save ocrd-browser:local | gzip > ocrd_browser_latest.tar.gz

      - name: 4. Subir como archivo descargable (Artefacto)
        uses: actions/upload-artifact@v4
        with:
          name: ocrd-browser-tarball
          path: ocrd_browser_latest.tar.gz
          retention-days: 3
