name: Empaquetar Stack Completo eScriptorium (Kraken 7) - Oficial

on:
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Liberar espacio en el servidor de GitHub
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Descargar imágenes base (GitLab INRIA con Reintentos)
        # Este bloque intentará descargar la imagen hasta 5 veces si detecta un timeout
        run: |
          echo "Descargando imagen App..."
          n=0
          until [ "$n" -ge 5 ]
          do
             docker pull registry.gitlab.inria.fr/scripta/escriptorium/app:latest && break
             n=$((n+1))
             echo "Intento $n fallido por timeout. Esperando 15 segundos para reintentar..."
             sleep 15
          done
          if [ "$n" -ge 5 ]; then echo "Error crítico: No se pudo descargar App tras 5 intentos."; exit 1; fi
          
          echo "Descargando imagen Celery..."
          n=0
          until [ "$n" -ge 5 ]
          do
             docker pull registry.gitlab.inria.fr/scripta/escriptorium/celery:latest && break
             n=$((n+1))
             echo "Intento $n fallido por timeout. Esperando 15 segundos para reintentar..."
             sleep 15
          done
          if [ "$n" -ge 5 ]; then echo "Error crítico: No se pudo descargar Celery tras 5 intentos."; exit 1; fi

      - name: Descargar imágenes de infraestructura y monitoreo
        run: |
          echo "Descargando Nginx, Postgres, Redis, Elasticsearch y stack de alertas..."
          docker pull nginx:alpine
          docker pull postgres:13
          docker pull redis:alpine
          docker pull elasticsearch:7.17.10
          docker pull prom/prometheus:latest
          docker pull prom/alertmanager:latest

      - name: Empaquetar TODAS las imágenes en un solo archivo
        run: |
          echo "Comprimiendo el ecosistema completo (esto tomará unos minutos)..."
          docker save \
            registry.gitlab.inria.fr/scripta/escriptorium/app:latest \
            registry.gitlab.inria.fr/scripta/escriptorium/celery:latest \
            nginx:alpine \
            postgres:13 \
            redis:alpine \
            elasticsearch:7.17.10 \
            prom/prometheus:latest \
            prom/alertmanager:latest \
            | gzip > escriptorium_full_stack_k7.tar.gz

      - name: Subir empaquetado como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: escriptorium-full-stack-kraken7
          path: escriptorium_full_stack_k7.tar.gz
          retention-days: 3
          
